{% extends "base.html" %}

{% block title %}Books | Bishop's Library{% endblock %}

{% block content %}

<h1>Our Book Collection</h1>
<dl>
    {% for book in library_books %}
    <dt>
        <a href="/books/{{ book.isbn }}">{{ book.title }}</a>
    </dt>
    {% endfor %}
</dl>
<p>Click on your book choice</p>
<a href="/">Back to homepage</a>

{% endblock %}
